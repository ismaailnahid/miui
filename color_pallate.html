<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f14">
  <title>Color Palette — Tap to Copy</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: radial-gradient(1200px 600px at 50% -10%, #16202b 0%, #0b0f14 60%, #07090c 100%);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #e6edf3;
      display: flex;
      justify-content: center;
      padding: 32px 18px 60px;
      padding-left: max(18px, env(safe-area-inset-left));
      padding-right: max(18px, env(safe-area-inset-right));
      padding-bottom: max(60px, env(safe-area-inset-bottom));
      overflow-x: hidden;
    }

    .wrap {
      width: 100%;
      max-width: 900px;
    }

    /* ============================================================
       HEADER
       ============================================================ */
    header {
      text-align: center;
      margin-bottom: 22px;
    }

    h1 {
      font-size: clamp(20px, 4vw, 28px);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    h1 span {
      background: linear-gradient(90deg, #1686D0, #00FF62, #FFC300);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .hint {
      margin-top: 8px;
      font-size: clamp(12px, 2vw, 13.5px);
      color: #8b98a5;
      line-height: 1.5;
      padding: 0 8px;
    }

    /* ============================================================
       TOGGLES
       ============================================================ */
    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 18px;
      background: #10161d;
      border: 1px solid rgba(255, 255, 255, 0.10);
      border-radius: 999px;
      cursor: pointer;
      user-select: none;
      font-size: 14px;
      font-weight: 600;
      transition: border-color 0.2s ease, background 0.2s ease,
        box-shadow 0.2s ease, opacity 0.2s ease;
    }

    .toggle-row:hover {
      border-color: rgba(255, 255, 255, 0.22);
    }

    .toggle-row:has(input:checked) {
      border-color: #1686D0;
      background: #0f1a23;
      box-shadow: 0 0 0 3px rgba(22, 134, 208, 0.12);
    }

    .toggle-row.argb:has(input:checked) {
      border-color: #FF7E29;
      background: #1d1410;
      box-shadow: 0 0 0 3px rgba(255, 126, 41, 0.14);
    }

    .toggle-row.dimmed {
      opacity: 0.38;
      pointer-events: none;
      filter: grayscale(0.6);
    }

    .toggle-row input {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
      pointer-events: none;
    }

    .switch {
      position: relative;
      flex-shrink: 0;
      width: 52px;
      height: 28px;
      border-radius: 999px;
      background: #26313d;
      border: 1px solid rgba(255, 255, 255, 0.10);
      transition: background 0.22s ease, border-color 0.22s ease;
    }

    .switch::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #8b98a5;
      transition: transform 0.24s cubic-bezier(.2, .9, .3, 1), background 0.22s ease;
    }

    input:checked+.switch {
      background: linear-gradient(90deg, #1686D0, #00FF62);
      border-color: transparent;
    }

    .toggle-row.argb input:checked+.switch {
      background: linear-gradient(90deg, #FFC300, #FF7E29);
    }

    input:checked+.switch::after {
      transform: translateX(24px);
      background: #ffffff;
    }

    input:focus-visible+.switch {
      outline: 2px solid #1686D0;
      outline-offset: 3px;
    }

    .t-label {
      display: flex;
      align-items: baseline;
      gap: 6px;
      white-space: nowrap;
    }

    .t-label .state-on {
      color: #00FF62;
    }

    .toggle-row.argb .t-label .state-on {
      color: #FFC300;
    }

    .t-label .state-off {
      color: #8b98a5;
    }

    /* ============================================================
       PREVIEW
       ============================================================ */
    .preview {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin: 0 auto 18px;
      font-size: clamp(12px, 2vw, 13.5px);
      color: #8b98a5;
    }

    .preview code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: clamp(13.5px, 2.4vw, 15px);
      font-weight: 700;
      letter-spacing: 0.06em;
      color: #e6edf3;
      background: #10161d;
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 6px 14px;
      border-radius: 999px;
      transition: border-color 0.2s ease;
    }

    .preview code.argb-on {
      border-color: rgba(255, 126, 41, 0.55);
    }

    .preview code.flash {
      animation: flash 0.4s ease;
    }

    @keyframes flash {
      0% {
        transform: scale(0.88);
        opacity: 0.35;
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    /* ============================================================
       COPY FULL PALETTE BUTTON
       ============================================================ */
    .copy-all-wrap {
      display: flex;
      justify-content: center;
      margin: 0 auto 26px;
    }

    .copy-all-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 22px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: #e6edf3;
      background: linear-gradient(135deg, #0f1a23 0%, #10161d 100%);
      border: 1px solid rgba(22, 134, 208, 0.45);
      border-radius: 999px;
      cursor: pointer;
      overflow: hidden;
      transition: border-color 0.22s ease, transform 0.18s cubic-bezier(.2, .8, .3, 1),
        box-shadow 0.22s ease, background 0.22s ease;
      box-shadow: 0 4px 14px rgba(22, 134, 208, 0.10);
    }

    .copy-all-btn::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, #1686D0, #00FF62, #FFC300);
      opacity: 0;
      transition: opacity 0.22s ease;
      z-index: 0;
    }

    .copy-all-btn>* {
      position: relative;
      z-index: 1;
    }

    .copy-all-btn:hover {
      border-color: #1686D0;
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(22, 134, 208, 0.28);
    }

    .copy-all-btn:hover::before {
      opacity: 0.10;
    }

    .copy-all-btn:active {
      transform: scale(0.97);
    }

    .copy-all-btn:focus-visible {
      outline: 2px solid #1686D0;
      outline-offset: 3px;
    }

    .copy-all-btn .icon {
      font-size: 16px;
      line-height: 1;
    }

    .copy-all-btn.copied {
      border-color: #00FF62;
      box-shadow: 0 0 0 3px rgba(0, 255, 98, 0.18), 0 10px 24px rgba(0, 255, 98, 0.22);
    }

    .copy-all-btn.copied::before {
      opacity: 0.16;
    }

    .copy-all-btn .btn-text {
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .copy-all-btn.copied .btn-text {
      color: #00FF62;
    }

    /* ============================================================
       PALETTE GRID
       ============================================================ */
    .palette {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(112px, 1fr));
      gap: 14px;
    }

    .swatch {
      position: relative;
      aspect-ratio: 1 / 1;
      border: 1px solid rgba(255, 255, 255, 0.10);
      border-radius: 16px;
      cursor: pointer;
      font-family: inherit;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding: 10px 8px;
      overflow: hidden;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
      transition: transform 0.18s cubic-bezier(.2, .8, .3, 1),
        box-shadow 0.18s ease,
        border-color 0.18s ease;
      -webkit-user-select: none;
      user-select: none;
    }

    .swatch:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 26px rgba(0, 0, 0, 0.5);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .swatch:active {
      transform: scale(0.95);
    }

    .swatch:focus-visible {
      outline: 2px solid #1686D0;
      outline-offset: 3px;
    }

    .hex {
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 4px 9px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.14);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      transition: transform 0.2s ease, opacity 0.2s ease;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .swatch.light .hex {
      background: rgba(255, 255, 255, 0.28);
    }

    /* ---------- Copied State ---------- */
    .tick {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      font-weight: 700;
      opacity: 0;
      transform: scale(0.4);
      transition: opacity 0.22s ease, transform 0.28s cubic-bezier(.2, 1.6, .5, 1);
      pointer-events: none;
    }

    .swatch.copied .tick {
      opacity: 1;
      transform: scale(1);
    }

    .swatch.copied .hex {
      opacity: 0;
      transform: translateY(10px);
    }

    .swatch.copied {
      border-color: rgba(255, 255, 255, 0.55);
    }

    /* ============================================================
       TOAST
       ============================================================ */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      bottom: calc(28px + env(safe-area-inset-bottom));
      transform: translate(-50%, 24px);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 18px;
      background: #141b23;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.55);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.02em;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease, transform 0.28s cubic-bezier(.2, .9, .3, 1);
      z-index: 99;
      white-space: nowrap;
      max-width: calc(100vw - 40px);
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .toast .dot {
      width: 15px;
      height: 15px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.3);
      flex-shrink: 0;
    }

    /* ============================================================
       RESPONSIVE — DELL LATITUDE E5450 (1366×768 laptop)
       ============================================================ */
    @media (min-width: 1024px) and (max-height: 800px) {

      body {
        padding: 18px 18px 30px;
      }

      header {
        margin-bottom: 14px;
      }

      .controls {
        margin-bottom: 12px;
      }

      .toggle-row {
        padding: 10px 16px;
        font-size: 13.5px;
      }

      .preview {
        margin-bottom: 14px;
      }

      .copy-all-wrap {
        margin-bottom: 18px;
      }

      .copy-all-btn {
        padding: 10px 20px;
        font-size: 13.5px;
      }

      .palette {
        grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
        gap: 11px;
      }

      .hex {
        font-size: 11.5px;
        padding: 3px 8px;
      }
    }

    /* Larger desktop / Full HD laptop */
    @media (min-width: 1100px) and (min-height: 801px) {
      .palette {
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
        gap: 16px;
      }

      .hex {
        font-size: 13px;
      }
    }

    /* ============================================================
       RESPONSIVE — REDMI NOTE 15 5G (~360–430px CSS width)
       ============================================================ */
    @media (max-width: 640px) {
      body {
        padding: 22px 16px 50px;
        padding-bottom: max(50px, env(safe-area-inset-bottom));
      }

      header {
        margin-bottom: 18px;
      }

      .hint {
        padding: 0 4px;
      }
    }

    @media (max-width: 520px) {
      .controls {
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
      }

      .toggle-row {
        justify-content: space-between;
        padding: 11px 16px;
        font-size: 13.5px;
      }
    }

    @media (max-width: 430px) {
      body {
        padding: 20px 14px 46px;
        padding-bottom: max(46px, env(safe-area-inset-bottom));
      }

      header {
        margin-bottom: 16px;
      }

      .palette {
        grid-template-columns: repeat(auto-fill, minmax(88px, 1fr));
        gap: 10px;
      }

      .swatch {
        border-radius: 14px;
        padding: 8px 6px;
      }

      .hex {
        font-size: 10.5px;
        padding: 3px 7px;
        letter-spacing: 0.04em;
      }

      .tick {
        font-size: 28px;
      }

      .preview {
        margin-bottom: 14px;
        gap: 8px;
      }

      .copy-all-wrap {
        margin-bottom: 20px;
      }

      .copy-all-btn {
        padding: 11px 18px;
        font-size: 13px;
        width: 100%;
        justify-content: center;
      }
    }

    @media (max-width: 380px) {
      body {
        padding: 18px 12px 42px;
        padding-bottom: max(42px, env(safe-area-inset-bottom));
      }

      .palette {
        grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
        gap: 9px;
      }

      .swatch {
        border-radius: 12px;
        padding: 7px 5px;
      }

      .hex {
        font-size: 10px;
        padding: 3px 6px;
      }

      .switch {
        width: 46px;
        height: 26px;
      }

      .switch::after {
        width: 18px;
        height: 18px;
        top: 3px;
        left: 3px;
      }

      input:checked+.switch::after {
        transform: translateX(20px);
      }

      .toggle-row {
        font-size: 13px;
        padding: 10px 14px;
        gap: 10px;
      }
    }

    /* Landscape phones */
    @media (max-height: 480px) and (orientation: landscape) {
      body {
        padding: 12px 20px 20px;
      }

      header {
        margin-bottom: 10px;
      }

      h1 {
        font-size: 18px;
      }

      .hint {
        display: none;
      }

      .controls {
        margin-bottom: 10px;
      }

      .preview {
        margin-bottom: 10px;
      }

      .copy-all-wrap {
        margin-bottom: 14px;
      }

      .palette {
        grid-template-columns: repeat(auto-fill, minmax(76px, 1fr));
        gap: 9px;
      }

      .hex {
        font-size: 10px;
        padding: 2px 6px;
      }
    }

    /* Touch device boost */
    @media (hover: none) and (pointer: coarse) {
      .swatch {
        min-height: 80px;
      }

      .copy-all-btn {
        min-height: 44px;
      }
    }

    /* Reduce motion preference */
    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>

  <div class="wrap">
    <header>
      <h1>🎨 <span>Color Palette</span></h1>
      <p class="hint">Tap any color — the code is copied to your clipboard automatically</p>
    </header>

    <!-- ===== Toggles ===== -->
    <div class="controls">
      <label class="toggle-row" id="hexToggleRow">
        <input type="checkbox" id="tglHash" checked>
        <span class="switch" aria-hidden="true"></span>
        <span class="t-label">
          <span class="state-on" id="labelOn">#000000 &nbsp;(with #)</span>
          <span class="state-off" id="labelOff" style="display:none;">000000 &nbsp;(without #)</span>
        </span>
      </label>

      <label class="toggle-row argb" id="argbToggleRow">
        <input type="checkbox" id="tglArgb">
        <span class="switch" aria-hidden="true"></span>
        <span class="t-label">
          <span id="argbLabel">ARGB (8 digit)</span>
        </span>
      </label>
    </div>

    <!-- ===== Live Preview ===== -->
    <div class="preview">
      <span>Will copy:</span>
      <code id="previewCode">#000000</code>
    </div>

    <!-- ===== Copy Full Palette Button ===== -->
    <div class="copy-all-wrap">
      <button type="button" class="copy-all-btn" id="copyAllBtn"
        aria-label="Copy the full color palette as an array">
        <span class="icon" aria-hidden="true">📋</span>
        <span class="btn-text" id="copyAllText">Copy Full Palette (12 colors)</span>
      </button>
    </div>

    <div class="palette" id="palette"></div>
  </div>

  <div class="toast" id="toast">
    <span class="dot" id="toastDot"></span>
    <span id="toastMsg">Copied!</span>
  </div>

  <script>
    /* ============================================================
       👇 Your color palette (shown as swatches)
       ============================================================ */
    const yourDefaultColorPalette = [
      '#000000', '#FFC300', '#041C30', '#1686D0',
      '#FFFFFF', '#FF7E29', '#0A2E39', '#006378',
      '#E1A3C7', '#FF2E2E', '#7646FF', '#00FF62',
      '#E68585', '#0000FF', '#FF5CA1', '#888888'
    ];

    /* ============================================================
       👇 Full palette list — copied as an array string when
          user clicks "Copy Full Palette"
       ============================================================ */
    const fullPaletteArray = [
      "#1686D0", "#006378", "#00FF62", "#061D2E",
      "#0A2E39", "#041C30", "#FFC300", "#FF7E29",
      "#FF5CA1", "#E68585", "#7646FF", "#000000"
    ];

    /* ---------------- Elements ---------------- */
    const paletteEl = document.getElementById('palette');
    const toastEl = document.getElementById('toast');
    const toastDot = document.getElementById('toastDot');
    const toastMsg = document.getElementById('toastMsg');

    const tglHash = document.getElementById('tglHash');
    const tglArgb = document.getElementById('tglArgb');

    const previewCode = document.getElementById('previewCode');
    const labelOn = document.getElementById('labelOn');
    const labelOff = document.getElementById('labelOff');
    const hexToggleRow = document.getElementById('hexToggleRow');

    const copyAllBtn = document.getElementById('copyAllBtn');
    const copyAllText = document.getElementById('copyAllText');

    /* ============================================================
       Two toggles — three modes
       ------------------------------------------------------------
       ✅ ARGB ON              → #FF000000   (8-digit ARGB)
       ✅ ARGB OFF, with #     → #000000     (6-digit with #)
       ⬜ ARGB OFF, without #  → 000000      (6-digit only)
       ============================================================ */
    let withHash = true;
    let argbMode = false;
    let previewColor = yourDefaultColorPalette[0];

    /* ---------------- Format Helpers ---------------- */
    function hexToArgb(hex) {
      const h = hex.replace('#', '').toUpperCase();
      const full = h.length === 3 ? h.split('').map(c => c + c).join('') : h;
      return '#FF' + full;
    }

    function applyFormat(hex) {
      if (argbMode) return hexToArgb(hex);
      return withHash ? hex : hex.replace(/^#/, '');
    }

    function renderPreview(animate = true) {
      previewCode.textContent = applyFormat(previewColor);
      previewCode.classList.toggle('argb-on', argbMode);
      if (!animate) return;
      previewCode.classList.remove('flash');
      void previewCode.offsetWidth;
      previewCode.classList.add('flash');
    }

    function updateToggleUI() {
      labelOn.style.display = withHash ? 'inline' : 'none';
      labelOff.style.display = withHash ? 'none' : 'inline';
      hexToggleRow.classList.toggle('dimmed', argbMode);
      renderPreview();
    }

    /* ---------------- Toggle Events ---------------- */
    tglHash.addEventListener('change', () => {
      withHash = tglHash.checked;
      updateToggleUI();
      if (navigator.vibrate) navigator.vibrate(8);
    });

    tglArgb.addEventListener('change', () => {
      argbMode = tglArgb.checked;
      updateToggleUI();
      if (navigator.vibrate) navigator.vibrate(8);
    });

    /* ---------------- Helpers ---------------- */
    function hexToRgb(hex) {
      const h = hex.replace('#', '').trim();
      const full = h.length === 3 ? h.split('').map(c => c + c).join('') : h;
      return {
        r: parseInt(full.substring(0, 2), 16),
        g: parseInt(full.substring(2, 4), 16),
        b: parseInt(full.substring(4, 6), 16)
      };
    }

    function isLightColor(hex) {
      const { r, g, b } = hexToRgb(hex);
      return ((0.299 * r + 0.587 * g + 0.114 * b) / 255) > 0.62;
    }

    async function copyText(text) {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
          return true;
        }
        throw new Error('clipboard unavailable');
      } catch (e) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.top = '-1000px';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        ta.setSelectionRange(0, ta.value.length);
        let ok = false;
        try { ok = document.execCommand('copy'); } catch (_) { ok = false; }
        document.body.removeChild(ta);
        return ok;
      }
    }

    /* ---------------- Toast ---------------- */
    let toastTimer;
    function showToast(hex, message) {
      toastDot.style.background = hex;
      toastMsg.textContent = message;
      toastEl.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1500);
    }

    /* ---------------- Copy Full Palette Button ---------------- */
    function formatArrayAsString(arr) {
      return '[' + arr.map(c => `"${c}"`).join(', ') + ']';
    }

    copyAllBtn.addEventListener('click', async () => {
      const text = formatArrayAsString(fullPaletteArray);
      const ok = await copyText(text);

      if (navigator.vibrate) navigator.vibrate(14);

      copyAllBtn.classList.add('copied');
      const originalText = copyAllText.textContent;
      copyAllText.textContent = ok ? '✓ Palette Copied!' : 'Copy failed';
      clearTimeout(copyAllBtn._t);
      copyAllBtn._t = setTimeout(() => {
        copyAllBtn.classList.remove('copied');
        copyAllText.textContent = originalText;
      }, 1400);

      showToast('#1686D0', ok ? `Full palette copied (${fullPaletteArray.length} colors)` : 'Copy failed');
    });

    /* ---------------- Build Palette ---------------- */
    function buildPalette(colors) {
      paletteEl.innerHTML = '';
      const fragment = document.createDocumentFragment();

      colors.forEach(hex => {
        const light = isLightColor(hex);
        const textColor = light ? '#0b0f14' : '#ffffff';

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'swatch' + (light ? ' light' : '');
        btn.style.background = hex;
        btn.style.color = textColor;
        btn.setAttribute('aria-label', `Copy ${hex}`);
        btn.title = `Tap to copy ${hex}`;

        btn.innerHTML = `
          <span class="tick" aria-hidden="true">✓</span>
          <span class="hex">${hex}</span>
        `;

        btn.addEventListener('click', async () => {
          const value = applyFormat(hex);
          const ok = await copyText(value);

          if (navigator.vibrate) navigator.vibrate(12);

          btn.classList.add('copied');
          clearTimeout(btn._t);
          btn._t = setTimeout(() => btn.classList.remove('copied'), 900);

          previewColor = hex;
          renderPreview();

          showToast(hex, ok ? `${value} copied!` : 'Copy failed');
        });

        fragment.appendChild(btn);
      });

      paletteEl.appendChild(fragment);
    }

    /* ---------------- Init ---------------- */
    copyAllText.textContent = `Copy Full Palette (${fullPaletteArray.length} colors)`;
    buildPalette(yourDefaultColorPalette);
    updateToggleUI();
    renderPreview(false);
  </script>
</body>

</html>
